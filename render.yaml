# Render Blueprint (free tier): WebSocket backend + Next.js frontend.
#
# Before first deploy:
# 1. Push this repo to GitHub/GitLab and connect it in Render.
# 2. For draw-app-ws, set in the dashboard (or when prompted): DATABASE_URL (e.g. Neon
#    free Postgres), JWT_SECRET (long random string). Both are required at runtime.
# 3. NEXT_PUBLIC_WS_URL must match your WebSocket service public URL. Default below assumes
#    the ws service name stays "draw-app-ws" → wss://draw-app-ws.onrender.com
#    If you rename the service, update NEXT_PUBLIC_WS_URL on draw-app-web and redeploy web.
# 4. Optional on draw-app-web: OPENAI_API_KEY and/or MISTRAL_API_KEY for /api/diagram.
#
# Deploy: Dashboard → New → Blueprint → select repo (this file at root).

services:
  # Realtime canvas sync (HTTP / and /health for Render health checks; WebSocket on same port)
  - type: web
    name: draw-app-ws
    runtime: node
    plan: free
    region: oregon
    buildCommand: corepack enable && corepack prepare pnpm@9.0.0 --activate && pnpm install --frozen-lockfile && pnpm exec turbo build --filter=ws-backend
    startCommand: pnpm --filter ws-backend start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false

  # Next.js app (drawing UI + optional AI diagram API)
  - type: web
    name: draw-app-web
    runtime: node
    plan: free
    region: oregon
    buildCommand: corepack enable && corepack prepare pnpm@9.0.0 --activate && pnpm install --frozen-lockfile && pnpm exec turbo build --filter=web
    startCommand: pnpm --filter web start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_WS_URL
        value: wss://draw-app-ws.onrender.com
